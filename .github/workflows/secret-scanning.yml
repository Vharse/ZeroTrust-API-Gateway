name: "Secret Scanning"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scanning:
    name: "Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    outputs:
      gitleaks-json-path: gitleaks-results.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and Verify Gitleaks CLI
        run: |
          VERSION="8.24.3"
          
          # Download binary and official checksum file using explicitly secured HTTPS protocol
          curl -sSL --proto "=https" -O https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
          curl -sSL --proto "=https" -O https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt
          
          # Validate integrity before extraction
          sha256sum --ignore-missing -c gitleaks_${VERSION}_checksums.txt
          
          # Unpack and add to PATH without root/sudo privileges
          tar -zxvf gitleaks_${VERSION}_linux_x64.tar.gz gitleaks
          mkdir -p ~/.local/bin
          mv gitleaks ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Cleanup downloaded artifacts
          rm gitleaks_${VERSION}_linux_x64.tar.gz gitleaks_${VERSION}_checksums.txt

      - name: Run Gitleaks Detection
        run: |
          # Added --no-git to scan current file state and bypass legacy commit history
          gitleaks detect --no-git --source=. --verbose --redact --report-path=gitleaks-results.json

      - name: Upload Secret Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.6.1
        with:
          name: secret-reports
          path: gitleaks-results.json
