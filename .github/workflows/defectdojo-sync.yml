name: "DefectDojo Ingestion"

on:
  workflow_call:
    inputs:
      sast_job_needed:
        required: false
        type: boolean
        default: true
      container_job_needed:
        required: false
        type: boolean
        default: true
    secrets:
      DEFECTDOJO_URL:
        required: false
      DEFECTDOJO_API_KEY:
        required: false

jobs:
  defectdojo-ingestion:
    name: "Sync Vulnerabilities to DefectDojo"
    runs-on: ubuntu-latest
    if: always()
    env:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
    steps:
      - name: Download Scan Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        continue-on-error: true
        with:
          path: all-reports

      - name: Push All Reports to DefectDojo
        if: ${{ env.DEFECTDOJO_URL != '' && env.DEFECTDOJO_API_KEY != '' }}
        run: |
          python3 -c '
          import os
          import sys
          import time
          import requests

          raw_url = os.environ.get("DEFECTDOJO_URL", "").strip()
          api_key = os.environ.get("DEFECTDOJO_API_KEY", "").strip()

          # Dynamically grab GitHub context variables
          github_repo = os.environ.get("GITHUB_REPOSITORY", "Unknown/Repository")
          repo_owner = github_repo.split("/")[0]
          repo_name = github_repo.split("/")[-1]
          commit_sha = os.environ.get("GITHUB_SHA", "latest")[:7]

          if not raw_url or not api_key:
              print("[-] DefectDojo credentials missing or empty. Skipping ingestion gracefully.")
              sys.exit(0)

          if not raw_url.startswith(("http://", "https://")):
              print(f"[-] Invalid DEFECTDOJO_URL format: {raw_url}. Must include protocol (http:// or https://).")
              sys.exit(0)

          base_url = raw_url.rstrip("/") + "/api/v2/import-scan/"
          headers = {
            "Authorization": "Token " + api_key,
            "accept": "application/json",
            "ngrok-skip-browser-warning": "69420"
            }

          scans = [
              {"path": "all-reports/trivy-json-report/trivy-results.json", "type": "Trivy Scan"},
              {"path": "all-reports/sast-secret-reports/semgrep-results.json", "type": "Semgrep JSON Report"},
              {"path": "all-reports/sast-secret-reports/gitleaks-results.json", "type": "Gitleaks Scan"}
          ]

          for scan in scans:
              file_path = scan["path"]
              scan_type = scan["type"]

              if not os.path.exists(file_path):
                  print(f"[-] Report not found: {file_path}, skipping...")
                  continue

              print(f"[+] Uploading {file_path} as {scan_type}...")
              success = False
              
              for attempt in range(3):
                  try:
                      with open(file_path, "rb") as f:
                          files = {"file": f}
                          data = {
                              "scan_type": scan_type,
                              "product_type_name": f"GitHub - {repo_owner}",
                              "product_name": repo_name,
                              "engagement_name": f"CI/CD Scan - Commit {commit_sha}",
                              "auto_create_context": "true",
                              "verified": "true",
                              "active": "true"
                          }
                          response = requests.post(base_url, headers=headers, data=data, files=files, timeout=120)
                          print(f"    Status: {response.status_code}")
                          print(f"    Response: {response.text}")
                          
                          if response.status_code in [200, 201]:
                              success = True
                              break
                          elif response.status_code == 502:
                              print(f"    [!] Cloudflare 502 Bad Gateway encountered on attempt {attempt + 1}/3.")
                              if attempt < 2:
                                  print(f"    Retrying in 10s...")
                                  time.sleep(10)
                                  continue
                              else:
                                  print(f"    [!] Max retries reached for 502. Bypassing upload to keep pipeline green.")
                                  success = True
                                  break
                          else:
                              print(f"    [!] Non-success status received. Bypassing to keep pipeline green.")
                              success = True
                              break
                  except Exception as e:
                      print(f"[-] Exception on attempt {attempt + 1}: {e}")
                      if attempt < 2:
                          time.sleep(5)
                          continue
                      else:
                          print(f"    [!] Max error retries reached. Bypassing to keep pipeline green.")
                          success = True
                          break

          print("[+] Ingestion step completed gracefully without failing pipeline.")
          sys.exit(0)
          '
